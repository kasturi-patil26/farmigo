<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmiGo - Digital Agriculture Platform</title>
    <meta name="description" content="Digital agriculture network connecting Farmers, Merchants, and Government with real-time mandi rates, AI forecasting, net profit calculation, and market intelligence." />
    <script>
      // Gracefully neutralize Vite HMR WebSocket in sandboxed iframe previews
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = urlStr.includes('vite') ||
              urlStr.includes('hmr') ||
              urlStr.includes(':24678') ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              protocols === 'vite-hmr';

            if (isViteHmr) {
              return {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                readyState: 3, // CLOSED
                url: urlStr,
                onclose: null,
                onerror: null,
                onmessage: null,
                onopen: null,
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; }
              };
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        window.addEventListener('error', function(event) {
          if (event && event.message && /websocket|vite|hmr/i.test(event.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || (reason ? String(reason) : '');
          if (/websocket|socket|vite|hmr/i.test(msg)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F7F1E3] text-[#2B2016] h-full font-body antialiased selection:bg-[#D9A441]/30 selection:text-[#2B2016]">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
